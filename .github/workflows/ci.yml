name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check Markdown links and language mirrors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")
          ignored = {
              ".git", "node_modules", ".tools", "data",
              ".agents", ".claude", ".codex", ".sparkclaw",
          }
          # Local agent instructions are ignored by Git and are not project docs.
          agent_files = {Path("AGENTS.md"), Path("CLAUDE.md")}
          base = []
          for path in root.rglob("*.md"):
              if any(part in ignored for part in path.parts):
                  continue
              if path in agent_files:
                  continue
              if path.parts and path.parts[0] == "zh-cn":
                  continue
              base.append(path)

          errors = []
          for path in sorted(base):
              zh = Path("zh-cn") / path
              if not zh.exists():
                  errors.append(f"missing Chinese mirror: {path} -> {zh}")
              text = path.read_text(encoding="utf-8")
              if "zh-cn" not in text or "简体中文" not in text:
                  errors.append(f"missing zh-cn language link: {path}")

          for path in sorted(Path("zh-cn").rglob("*.md")):
              if any(part in ignored for part in path.parts):
                  continue
              counterpart = Path(*path.parts[1:])
              if not counterpart.exists():
                  errors.append(f"extra Chinese mirror without source: {path}")
              text = path.read_text(encoding="utf-8")
              if "English" not in text:
                  errors.append(f"missing English language link: {path}")

          link_pattern = re.compile(r"\[[^\]]+\]\(([^)]+)\)")
          for path in sorted(root.rglob("*.md")):
              if any(part in ignored for part in path.parts):
                  continue
              if path in agent_files:
                  continue
              for raw in link_pattern.findall(path.read_text(encoding="utf-8")):
                  target = raw.split("#", 1)[0].strip()
                  if not target or "://" in target or target.startswith(("mailto:", "#")):
                      continue
                  if target.startswith("<") and target.endswith(">"):
                      target = target[1:-1]
                  candidate = (root / target.lstrip("/")).resolve() if target.startswith("/") else (path.parent / target).resolve()
                  try:
                      candidate.relative_to(root.resolve())
                  except ValueError:
                      continue
                  if not candidate.exists():
                      errors.append(f"broken local markdown link in {path}: {raw}")

          if errors:
              print("\n".join(errors))
              raise SystemExit(1)
          print(f"checked {len(base)} project markdown files")
          PY

  webchat:
    name: WebChat
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm --workspace @sparkclaw/webchat run test
      - run: npm --workspace @sparkclaw/webchat run build

  gateway:
    name: Gateway
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install CJK weather-card font
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fontconfig fonts-noto-cjk
          fc-list ':lang=zh-cn' family | grep 'Noto' >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document tool runtimes
        run: npm run setup:document-tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      - run: go vet ./...
        working-directory: services/gateway
      - run: go test ./...
        working-directory: services/gateway

  gateway-race:
    name: Gateway race (concurrency-heavy packages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: services/gateway/go.sum
      - run: >
          go test -race
          ./internal/store/... ./internal/connector/... ./internal/gateway/...
          ./internal/telegram/... ./internal/weixin/... ./internal/speech/...
          ./internal/delivery/... ./internal/messagecontrol/...
          ./internal/browserautomation/...
        working-directory: services/gateway

  asr-runtime:
    name: ASR Runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/asr-runtime/requirements-test.txt
      - name: Install fake-model test runtime
        run: python -m pip install -r services/asr-runtime/requirements-test.txt
      - name: Test fake-model ASR protocol
        run: python -m unittest discover -s services/asr-runtime -p 'test_*.py'

  compose:
    name: Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts/test_install.py
      - run: python3 -m unittest scripts/test_dotenv.py
      - run: python3 -m unittest scripts/test_model_readiness.py
      - run: python3 -m unittest scripts/test_model_capacity_entrypoint.py
      - run: python3 -m unittest scripts/test_serve_models_compose.py
      - run: python3 -m unittest scripts/test_runtime_compose.py
      - run: python3 -m unittest scripts/test_resolve_browser_display.py
      - run: python3 -m unittest scripts/test_cloud_compose.py
      - run: python3 -m unittest scripts/test_autostart_compose.py
      - run: python3 -m unittest scripts/test_jingsi_lan.py
      - run: bash -n install.sh scripts/lib/dotenv.sh scripts/deploy.sh scripts/autostart_compose.sh scripts/install_autostart_systemd.sh scripts/serve_models_compose.sh scripts/restart_runtime_compose.sh scripts/start_cloud_compose.sh scripts/resolve-browser-display.sh scripts/restart_jingsi_lan_compose.sh scripts/start_compose.sh scripts/doctor.sh
      - run: bash -s -- --help < install.sh | grep -F 'curl -fsSL'
      - run: cp docker/env/sparkclaw.example.env .env
      - run: docker compose --env-file .env -f docker/compose.yaml config --quiet
      - run: docker compose --env-file docker/env/sparkclaw.cloud.example.env -f docker/compose.yaml -f docker/compose.cloud.yaml --profile models-local config --quiet
      - run: SPARKCLAW_JINGSI_LAN_BIND=192.168.1.8 SPARKCLAW_JINGSI_SESSION_ID=session-ci docker compose --env-file .env -f docker/compose.yaml -f docker/compose.jingsi-lan.yaml config --quiet
      - name: Verify product runtime defaults
        run: |
          docker compose \
            --env-file .env \
            --env-file docker/env/sparkclaw.single-fast.env \
            --env-file docker/env/sparkclaw.asr.env \
            --env-file docker/env/sparkclaw.ocr.env \
            -f docker/compose.yaml \
            -f docker/compose.dual-light.yaml \
            -f docker/compose.asr.yaml \
            -f docker/compose.ocr.yaml \
            --profile models-local \
            config --format json > /tmp/sparkclaw-compose.json
          python3 - <<'PY'
          import json

          with open("/tmp/sparkclaw-compose.json", encoding="utf-8") as source:
              config = json.load(source)
          environment = config["services"]["gateway"]["environment"]
          assert environment["SPARKCLAW_MODEL_MODE"] == "external"
          assert environment["SPARKCLAW_STATE_BACKEND"] == "postgres"
          assert environment["SPARKCLAW_SPEECH_ENABLED"] == "true"
          assert environment["SPARKCLAW_OCR_ENABLED"] == "true"
          assert environment["SPARKCLAW_DEEP_BASE_URL"] == environment["SPARKCLAW_FAST_BASE_URL"]
          assert environment["SPARKCLAW_DEEP_MODEL"] == environment["SPARKCLAW_FAST_MODEL"]
          assert environment["SPARKCLAW_MODEL_CAPACITY_PROFILE"] == "dgx-spark-single-fast-v1"
          assert all(key not in environment for key in (
              "SPARKCLAW_FAST_CONTEXT_TOKENS", "SPARKCLAW_FAST_MAX_INPUT_TOKENS", "SPARKCLAW_FAST_MAX_TOKENS",
              "SPARKCLAW_DEEP_CONTEXT_TOKENS", "SPARKCLAW_DEEP_MAX_INPUT_TOKENS", "SPARKCLAW_DEEP_MAX_TOKENS",
          ))
          assert "postgres" in config["services"]
          assert "sparkclaw-asr" in config["services"]
          assert "sparkclaw-ocr" in config["services"]
          asr_command = config["services"]["sparkclaw-asr"]["command"]
          assert asr_command[0] == "Qwen/Qwen3-ASR-0.6B"
          assert asr_command[asr_command.index("--kv-cache-memory-bytes") + 1] == "2G"
          assert not config["services"]["gateway"].get("ports")
          fast = config["services"]["sparkclaw-fast"]
          assert fast["image"] == "sparkclaw-chat-vllm-readiness:local"
          assert fast["build"]["dockerfile"] == "docker/images/vllm.Dockerfile"
          assert fast["build"]["args"]["SPARKCLAW_VLLM_IMAGE"] == "vllm/vllm-openai:v0.24.0"
          assert "SPARKCLAW_VLLM_NATIVE_NVFP4_W4A4" not in fast["build"]["args"]
          assert fast["command"][0] == "nvidia/Qwen3.6-35B-A3B-NVFP4"
          assert "--max-model-len" not in fast["command"]
          assert fast["entrypoint"] == ["python3", "/opt/sparkclaw/model_capacity_entrypoint.py"]
          assert fast["environment"]["SPARKCLAW_MODEL_CAPACITY_LANE"] == "fast"
          assert fast["environment"]["SPARKCLAW_MODEL_CAPACITY_PROFILE"] == "dgx-spark-single-fast-v1"
          assert fast["command"][fast["command"].index("--kv-cache-memory-bytes") + 1] == "8G"
          assert fast["command"][fast["command"].index("--max-num-seqs") + 1] == "4"
          assert all(flag not in fast["command"] for flag in (
              "--quantization", "--moe-backend", "--attention-backend", "--kv-cache-dtype",
          ))
          assert "--speculative-config" not in fast["command"]
          assert fast["healthcheck"]["test"][1] == "python3"
          deep = config["services"]["sparkclaw-deep"]
          assert deep["image"] == "sparkclaw-chat-vllm-readiness:local"
          assert deep["command"][0] == "nvidia/Qwen3.6-35B-A3B-NVFP4"
          assert "--max-model-len" not in deep["command"]
          assert deep["environment"]["SPARKCLAW_MODEL_CAPACITY_LANE"] == "deep"
          assert deep["command"][deep["command"].index("--kv-cache-memory-bytes") + 1] == "12G"
          assert deep["command"][deep["command"].index("--max-num-seqs") + 1] == "2"
          assert all(flag not in deep["command"] for flag in (
              "--quantization", "--moe-backend", "--attention-backend", "--kv-cache-dtype",
          ))
          assert "--speculative-config" not in deep["command"]
          assert deep["healthcheck"]["test"][1] == "python3"
          assert all(
              volume["target"] != "/opt/sparkclaw/model_readiness.py"
              for volume in fast.get("volumes", [])
          )
          assert fast["tmpfs"] == [
              "/run/sparkclaw-readiness:rw,noexec,nosuid,nodev,size=1m,mode=1777"
          ]
          assert "/run/sparkclaw-readiness/fast-warmed" in fast["healthcheck"]["test"]
          assert config["services"]["webchat"]["ports"] == [{
              "mode": "ingress",
              "host_ip": "0.0.0.0",
              "target": 18790,
              "published": "18790",
              "protocol": "tcp",
          }]
          PY
          docker compose \
            --env-file .env \
            --env-file docker/env/sparkclaw.dual-light.env \
            -f docker/compose.yaml \
            -f docker/compose.dual-light.yaml \
            --profile models-local \
            config --format json > /tmp/sparkclaw-dual-light-compose.json
          python3 - <<'PY'
          import json

          with open("/tmp/sparkclaw-dual-light-compose.json", encoding="utf-8") as source:
              config = json.load(source)
          environment = config["services"]["gateway"]["environment"]
          assert environment["SPARKCLAW_MODEL_CAPACITY_PROFILE"] == "dgx-spark-dual-light-v1"
          assert environment["SPARKCLAW_DEEP_BASE_URL"] == "http://sparkclaw-deep:8002/v1"
          assert config["services"]["sparkclaw-deep"]["environment"]["SPARKCLAW_MODEL_CAPACITY_PROFILE"] == "dgx-spark-dual-light-v1"
          PY
      - name: Verify custom WebChat host port
        run: |
          SPARKCLAW_WEBCHAT_PORT=19876 docker compose \
            --env-file .env \
            -f docker/compose.yaml \
            --profile models-local \
            config --format json > /tmp/sparkclaw-compose-custom-port.json
          SPARKCLAW_WEBCHAT_PORT=19876 docker compose \
            --env-file .env \
            -f docker/compose.dev.yaml \
            config --format json > /tmp/sparkclaw-compose-dev-custom-port.json
          python3 - <<'PY'
          import json

          with open("/tmp/sparkclaw-compose-custom-port.json", encoding="utf-8") as source:
              config = json.load(source)
          expected_ports = [{
              "mode": "ingress",
              "host_ip": "0.0.0.0",
              "target": 18790,
              "published": "19876",
              "protocol": "tcp",
          }]
          assert config["services"]["webchat"]["ports"] == expected_ports
          with open("/tmp/sparkclaw-compose-dev-custom-port.json", encoding="utf-8") as source:
              dev_config = json.load(source)
          assert dev_config["services"]["webchat"]["ports"] == expected_ports
          PY
      - run: >-
          SPARKCLAW_BROWSER_DISPLAY=:1
          SPARKCLAW_BROWSER_XAUTHORITY=/tmp/Xauthority
          docker compose --env-file .env
          -f docker/compose.yaml -f docker/compose.visible-browser.yaml
          config --quiet
