name: sparkclaw

services:
  gateway:
    environment:
      SPARKCLAW_SPEECH_ENABLED: ${SPARKCLAW_SPEECH_ENABLED:-true}
      SPARKCLAW_SPEECH_BACKEND: ${SPARKCLAW_SPEECH_BACKEND:-openai-http}
      SPARKCLAW_SPEECH_BASE_URL: ${SPARKCLAW_SPEECH_BASE_URL:-http://sparkclaw-asr:8006}
      SPARKCLAW_SPEECH_ALLOWED_HOSTS: ${SPARKCLAW_SPEECH_ALLOWED_HOSTS:-sparkclaw-asr,127.0.0.1,localhost}
      SPARKCLAW_SPEECH_MODEL: ${SPARKCLAW_SPEECH_MODEL:-sparkclaw-asr}
      SPARKCLAW_SPEECH_DEFAULT_LANGUAGE: ${SPARKCLAW_SPEECH_DEFAULT_LANGUAGE:-auto}
      SPARKCLAW_SPEECH_TIMEOUT_SECONDS: ${SPARKCLAW_SPEECH_TIMEOUT_SECONDS:-120}
      SPARKCLAW_SPEECH_MAX_AUDIO_SECONDS: ${SPARKCLAW_SPEECH_MAX_AUDIO_SECONDS:-60}
      SPARKCLAW_SPEECH_MAX_UPLOAD_BYTES: ${SPARKCLAW_SPEECH_MAX_UPLOAD_BYTES:-3145728}
      SPARKCLAW_SPEECH_MAX_CONCURRENCY: ${SPARKCLAW_SPEECH_MAX_CONCURRENCY:-1}
      SPARKCLAW_SPEECH_MAX_PENDING: ${SPARKCLAW_SPEECH_MAX_PENDING:-1}
      SPARKCLAW_SPEECH_EXPECTED_RUNTIME_VERSION: ${SPARKCLAW_SPEECH_EXPECTED_RUNTIME_VERSION:-0.19.2rc1.dev134+gfe9c3d6c5}
    depends_on:
      sparkclaw-asr:
        condition: service_healthy

  sparkclaw-asr:
    profiles: ["models-local"]
    image: ${SPARKCLAW_ASR_IMAGE:-sparkclaw-asr-vllm:cu130-nightly-realtime}
    build:
      context: ..
      dockerfile: docker/images/asr-vllm.Dockerfile
      args:
        SPARKCLAW_VLLM_IMAGE: ${SPARKCLAW_VLLM_IMAGE:-vllm/vllm-openai:cu130-nightly}
    ipc: host
    shm_size: ${SPARKCLAW_ASR_SHM_SIZE:-4gb}
    gpus: all
    environment:
      HF_HOME: /models/huggingface
      HF_TOKEN: ${HF_TOKEN:-${HUGGING_FACE_HUB_TOKEN:-}}
      HUGGING_FACE_HUB_TOKEN: ${HUGGING_FACE_HUB_TOKEN:-${HF_TOKEN:-}}
      MODELSCOPE_CACHE: /models/modelscope
      VLLM_LOGGING_LEVEL: ${SPARKCLAW_VLLM_LOGGING_LEVEL:-INFO}
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: ${SPARKCLAW_ASR_VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS:-0}
      VLLM_WORKER_MULTIPROC_METHOD: spawn
    volumes:
      - ${SPARKCLAW_MODEL_CACHE:-../data/models}:/models
    command:
      - ${SPARKCLAW_ASR_MODEL_ID:-/models/modelscope/Qwen3-ASR-0.6B}
      - --host
      - 0.0.0.0
      - --port
      - ${SPARKCLAW_ASR_PORT:-8006}
      - --served-model-name
      - ${SPARKCLAW_ASR_SERVED_NAME:-sparkclaw-asr}
      - --gpu-memory-utilization
      - ${SPARKCLAW_ASR_GPU_MEMORY_UTILIZATION:-0.10}
      - --max-model-len
      - ${SPARKCLAW_ASR_MAX_MODEL_LEN:-8192}
      - --max-num-seqs
      - ${SPARKCLAW_ASR_MAX_NUM_SEQS:-1}
      - --dtype
      - ${SPARKCLAW_ASR_DTYPE:-bfloat16}
      - --enforce-eager
      - --max-audio-seconds
      - ${SPARKCLAW_SPEECH_MAX_AUDIO_SECONDS:-60}
      - --max-upload-bytes
      - ${SPARKCLAW_SPEECH_MAX_UPLOAD_BYTES:-3145728}
      - --chunk-size-sec
      - ${SPARKCLAW_ASR_STREAMING_CHUNK_SECONDS:-1.0}
    ports:
      - "127.0.0.1:${SPARKCLAW_ASR_PORT:-8006}:${SPARKCLAW_ASR_PORT:-8006}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${SPARKCLAW_ASR_PORT:-8006}/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 20
      start_period: ${SPARKCLAW_MODEL_HEALTH_START_PERIOD:-3h}
    networks:
      - sparkclaw_internal
