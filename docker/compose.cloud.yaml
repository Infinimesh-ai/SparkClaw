services:
  postgres:
    restart: unless-stopped

  sandbox-runner:
    restart: unless-stopped

  gateway:
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPARKCLAW_API_TOKEN: ${SPARKCLAW_API_TOKEN:-}

  webchat:
    restart: unless-stopped
