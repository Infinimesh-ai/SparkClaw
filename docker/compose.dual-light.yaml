name: sparkclaw

services:
  sparkclaw-fast:
    command:
      - ${SPARKCLAW_FAST_MODEL_ID:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --served-model-name
      - ${SPARKCLAW_FAST_SERVED_NAME:-sparkclaw-fast}
      - --tensor-parallel-size
      - ${SPARKCLAW_FAST_TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${SPARKCLAW_FAST_GPU_MEMORY_UTILIZATION:-0.42}
      - --kv-cache-memory-bytes
      - ${SPARKCLAW_FAST_KV_CACHE_MEMORY_BYTES:-8G}
      - --max-num-seqs
      - ${SPARKCLAW_FAST_MAX_NUM_SEQS:-4}
      - --trust-remote-code
      - --enable-prefix-caching
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --language-model-only

  sparkclaw-deep:
    command:
      - ${SPARKCLAW_DEEP_MODEL_ID:-nvidia/Qwen3.6-35B-A3B-NVFP4}
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --served-model-name
      - ${SPARKCLAW_DEEP_SERVED_NAME:-sparkclaw-deep}
      - --tensor-parallel-size
      - ${SPARKCLAW_DEEP_TENSOR_PARALLEL_SIZE:-1}
      - --gpu-memory-utilization
      - ${SPARKCLAW_DEEP_GPU_MEMORY_UTILIZATION:-0.36}
      - --kv-cache-memory-bytes
      - ${SPARKCLAW_DEEP_KV_CACHE_MEMORY_BYTES:-12G}
      - --max-num-seqs
      - ${SPARKCLAW_DEEP_MAX_NUM_SEQS:-2}
      - --trust-remote-code
      - --enable-prefix-caching
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --language-model-only

  sparkclaw-embedding:
    command:
      - ${SPARKCLAW_EMBEDDING_MODEL_ID:-Qwen/Qwen3-Embedding-0.6B}
      - --host
      - 0.0.0.0
      - --port
      - "8003"
      - --served-model-name
      - ${SPARKCLAW_EMBEDDING_SERVED_NAME:-sparkclaw-embedding}
      - --gpu-memory-utilization
      - ${SPARKCLAW_EMBEDDING_GPU_MEMORY_UTILIZATION:-0.06}
      - --kv-cache-memory-bytes
      - ${SPARKCLAW_EMBEDDING_KV_CACHE_MEMORY_BYTES:-2G}
      - --max-num-seqs
      - ${SPARKCLAW_EMBEDDING_MAX_NUM_SEQS:-1}

  sparkclaw-guard:
    command:
      - ${SPARKCLAW_GUARD_MODEL_ID:-Qwen/Qwen3Guard-Gen-0.6B}
      - --host
      - 0.0.0.0
      - --port
      - "8005"
      - --served-model-name
      - ${SPARKCLAW_GUARD_SERVED_NAME:-Qwen/Qwen3Guard-Gen-0.6B}
      - --gpu-memory-utilization
      - ${SPARKCLAW_GUARD_GPU_MEMORY_UTILIZATION:-0.04}
      - --kv-cache-memory-bytes
      - ${SPARKCLAW_GUARD_KV_CACHE_MEMORY_BYTES:-2G}
      - --max-num-seqs
      - ${SPARKCLAW_GUARD_MAX_NUM_SEQS:-1}
      - --enforce-eager
