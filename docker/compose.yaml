name: sparkclaw

services:
  gateway:
    profiles: ["product", "eval"]
    build:
      context: ..
      dockerfile: docker/images/gateway.Dockerfile
    user: "${SPARKCLAW_CONTAINER_UID:-1000}:${SPARKCLAW_CONTAINER_GID:-1000}"
    init: true
    restart: unless-stopped
    depends_on:
      gotenberg:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SPARKCLAW_BIND: 0.0.0.0
      SPARKCLAW_PORT: ${SPARKCLAW_PORT:-18789}
      SPARKCLAW_API_TOKEN: ""
      SPARKCLAW_PAIRING_REQUIRED: ${SPARKCLAW_PAIRING_REQUIRED:-true}
      SPARKCLAW_WEBCHAT_PROXY_TOKEN: ${SPARKCLAW_WEBCHAT_PROXY_TOKEN:?run npm run deploy:local or npm run deploy:remote first}
      SPARKCLAW_DEPLOYMENT_PROFILE: ${SPARKCLAW_DEPLOYMENT_PROFILE:?select deploy:local/start:local or deploy:remote/start:remote}
      SPARKCLAW_WORKSPACE_ROOT: ${SPARKCLAW_WORKSPACE_ROOT:-/var/lib/sparkclaw/workspaces}
      SPARKCLAW_TRACE_DIR: ${SPARKCLAW_TRACE_DIR:-/var/lib/sparkclaw/traces}
      SPARKCLAW_BROWSER_READ_ALLOW_HOSTS: ${SPARKCLAW_BROWSER_READ_ALLOW_HOSTS:-}
      SPARKCLAW_BROWSER_AUTOMATION_TIMEOUT_MS: ${SPARKCLAW_BROWSER_AUTOMATION_TIMEOUT_MS:-30000}
      SPARKCLAW_BROWSER_AUTOMATION_STARTUP_TIMEOUT_MS: ${SPARKCLAW_BROWSER_AUTOMATION_STARTUP_TIMEOUT_MS:-10000}
      SPARKCLAW_BROWSER_AUTOMATION_SETTLE_TIMEOUT_MS: ${SPARKCLAW_BROWSER_AUTOMATION_SETTLE_TIMEOUT_MS:-15000}
      SPARKCLAW_BROWSER_AUTOMATION_SETTLE_QUIET_PERIOD_MS: ${SPARKCLAW_BROWSER_AUTOMATION_SETTLE_QUIET_PERIOD_MS:-500}
      SPARKCLAW_BROWSER_AUTOMATION_SETTLE_POLL_INTERVAL_MS: ${SPARKCLAW_BROWSER_AUTOMATION_SETTLE_POLL_INTERVAL_MS:-100}
      SPARKCLAW_BROWSER_AUTOMATION_ROUTE_REBIND_LIMIT: ${SPARKCLAW_BROWSER_AUTOMATION_ROUTE_REBIND_LIMIT:-2}
      SPARKCLAW_BROWSER_EXTENSION_CONTROLLER_SOCKET: ${SPARKCLAW_BROWSER_EXTENSION_CONTROLLER_SOCKET:-/run/sparkclaw/browser-controller/controller.sock}
      SPARKCLAW_BROWSER_EXTENSION_PROFILE_ID: ${SPARKCLAW_BROWSER_EXTENSION_PROFILE_ID:-default}
      SPARKCLAW_BROWSER_EXTENSION_CONNECT_TIMEOUT_MS: ${SPARKCLAW_BROWSER_EXTENSION_CONNECT_TIMEOUT_MS:-15000}
      SPARKCLAW_ARTIFACT_BACKEND: ${SPARKCLAW_ARTIFACT_BACKEND:-filesystem}
      SPARKCLAW_ARTIFACT_DIR: ${SPARKCLAW_ARTIFACT_DIR:-/var/lib/sparkclaw/artifacts}
      SPARKCLAW_ARTIFACT_BUCKET: ${SPARKCLAW_ARTIFACT_BUCKET:-sparkclaw}
      SPARKCLAW_S3_ENDPOINT: ${SPARKCLAW_S3_ENDPOINT:-http://minio:9000}
      SPARKCLAW_S3_REGION: ${SPARKCLAW_S3_REGION:-us-east-1}
      SPARKCLAW_S3_ACCESS_KEY: ${SPARKCLAW_S3_ACCESS_KEY:-sparkclaw}
      SPARKCLAW_S3_SECRET_KEY: ${SPARKCLAW_S3_SECRET_KEY:-sparkclaw-local}
      SPARKCLAW_STATE_BACKEND: ${SPARKCLAW_STATE_BACKEND:-file}
      SPARKCLAW_STATE_PATH: ${SPARKCLAW_STATE_PATH:-/var/lib/sparkclaw/memory/gateway-state.json}
      SPARKCLAW_STATE_DSN: ${SPARKCLAW_STATE_DSN:-postgres://sparkclaw:sparkclaw@postgres:5432/sparkclaw?sslmode=disable}
      SPARKCLAW_STATE_STARTUP_TIMEOUT_SECONDS: ${SPARKCLAW_STATE_STARTUP_TIMEOUT_SECONDS:-180}
      SPARKCLAW_STATE_READ_TIMEOUT_SECONDS: ${SPARKCLAW_STATE_READ_TIMEOUT_SECONDS:-10}
      SPARKCLAW_STATE_WRITE_TIMEOUT_SECONDS: ${SPARKCLAW_STATE_WRITE_TIMEOUT_SECONDS:-30}
      SPARKCLAW_STATE_TRANSACTION_TIMEOUT_SECONDS: ${SPARKCLAW_STATE_TRANSACTION_TIMEOUT_SECONDS:-60}
      SPARKCLAW_STATE_ENCRYPT_AT_REST: ${SPARKCLAW_STATE_ENCRYPT_AT_REST:-false}
      SPARKCLAW_STATE_ENCRYPTION_KEY: ${SPARKCLAW_STATE_ENCRYPTION_KEY:-}
      SPARKCLAW_STATE_ENCRYPTION_KEY_FILE: ${SPARKCLAW_STATE_ENCRYPTION_KEY_FILE:-}
      SPARKCLAW_CREDENTIAL_KEY: ${SPARKCLAW_CREDENTIAL_KEY:-}
      SPARKCLAW_CREDENTIAL_KEY_FILE: ${SPARKCLAW_CREDENTIAL_KEY_FILE:-/var/lib/sparkclaw/memory/gateway-credentials.key}
      SPARKCLAW_JINGSI_LAN_ENABLED: ${SPARKCLAW_JINGSI_LAN_ENABLED:-false}
      SPARKCLAW_JINGSI_SESSION_ID: ${SPARKCLAW_JINGSI_SESSION_ID:-}
      SPARKCLAW_JINGSI_MAX_MESSAGE_BYTES: ${SPARKCLAW_JINGSI_MAX_MESSAGE_BYTES:-65536}
      SPARKCLAW_WEIXIN_NOTIFICATION_ENABLED: ${SPARKCLAW_WEIXIN_NOTIFICATION_ENABLED:-false}
      SPARKCLAW_TELEGRAM_ENABLED: ${SPARKCLAW_TELEGRAM_ENABLED:-false}
      SPARKCLAW_TELEGRAM_BASE_URL: ${SPARKCLAW_TELEGRAM_BASE_URL:-https://api.telegram.org}
      SPARKCLAW_TELEGRAM_POLL_TIMEOUT_SECONDS: ${SPARKCLAW_TELEGRAM_POLL_TIMEOUT_SECONDS:-30}
      SPARKCLAW_TELEGRAM_MAX_DOWNLOAD_BYTES: ${SPARKCLAW_TELEGRAM_MAX_DOWNLOAD_BYTES:-20971520}
      SPARKCLAW_TELEGRAM_MAX_ATTACHMENTS: ${SPARKCLAW_TELEGRAM_MAX_ATTACHMENTS:-5}
      SPARKCLAW_TELEGRAM_MAX_VOICE_SECONDS: ${SPARKCLAW_TELEGRAM_MAX_VOICE_SECONDS:-120}
      SPARKCLAW_TELEGRAM_MAX_CONCURRENCY: ${SPARKCLAW_TELEGRAM_MAX_CONCURRENCY:-4}
      SPARKCLAW_TELEGRAM_MAX_PENDING: ${SPARKCLAW_TELEGRAM_MAX_PENDING:-32}
      SPARKCLAW_SANDBOX_BACKEND: ${SPARKCLAW_SANDBOX_BACKEND:-http}
      SPARKCLAW_SANDBOX_RUNNER_URL: ${SPARKCLAW_SANDBOX_RUNNER_URL:-http://sandbox-runner:18889}
      SPARKCLAW_SANDBOX_IMAGE: ${SPARKCLAW_SANDBOX_IMAGE:-alpine:3.22}
      SPARKCLAW_SANDBOX_NETWORK: ${SPARKCLAW_SANDBOX_NETWORK:-none}
      SPARKCLAW_MODEL_MODE: ${SPARKCLAW_MODEL_MODE:-external}
      SPARKCLAW_MODEL_HTTP_TIMEOUT_SECONDS: ${SPARKCLAW_MODEL_HTTP_TIMEOUT_SECONDS:-300}
      SPARKCLAW_MODEL_DISABLE_THINKING: ${SPARKCLAW_MODEL_DISABLE_THINKING:-true}
      SPARKCLAW_SPEECH_ENABLED: ${SPARKCLAW_SPEECH_ENABLED:-false}
      SPARKCLAW_SPEECH_BACKEND: ${SPARKCLAW_SPEECH_BACKEND:-openai-http}
      SPARKCLAW_SPEECH_BASE_URL: ${SPARKCLAW_SPEECH_BASE_URL:-}
      SPARKCLAW_SPEECH_ALLOWED_HOSTS: ${SPARKCLAW_SPEECH_ALLOWED_HOSTS:-}
      SPARKCLAW_SPEECH_MODEL: ${SPARKCLAW_SPEECH_MODEL:-sparkclaw-asr}
      SPARKCLAW_SPEECH_DEFAULT_LANGUAGE: ${SPARKCLAW_SPEECH_DEFAULT_LANGUAGE:-auto}
      SPARKCLAW_SPEECH_TIMEOUT_SECONDS: ${SPARKCLAW_SPEECH_TIMEOUT_SECONDS:-120}
      SPARKCLAW_SPEECH_MAX_AUDIO_SECONDS: ${SPARKCLAW_SPEECH_MAX_AUDIO_SECONDS:-60}
      SPARKCLAW_SPEECH_MAX_UPLOAD_BYTES: ${SPARKCLAW_SPEECH_MAX_UPLOAD_BYTES:-3145728}
      SPARKCLAW_SPEECH_MAX_CONCURRENCY: ${SPARKCLAW_SPEECH_MAX_CONCURRENCY:-1}
      SPARKCLAW_SPEECH_MAX_PENDING: ${SPARKCLAW_SPEECH_MAX_PENDING:-1}
      SPARKCLAW_SPEECH_EXPECTED_RUNTIME_VERSION: ${SPARKCLAW_SPEECH_EXPECTED_RUNTIME_VERSION:-}
      SPARKCLAW_ISCP_PAIRING_ENABLED: ${SPARKCLAW_ISCP_PAIRING_ENABLED:-false}
      SPARKCLAW_ISCP_DOMAIN_ID: ${SPARKCLAW_ISCP_DOMAIN_ID:-}
      SPARKCLAW_ISCP_AUTHORITY_URL: ${SPARKCLAW_ISCP_AUTHORITY_URL:-}
      SPARKCLAW_ISCP_AUTHORITY_TOKEN_ENV: ${SPARKCLAW_ISCP_AUTHORITY_TOKEN_ENV:-}
      SPARKCLAW_ISCP_AUTHORITY_TOKEN_FILE: ${SPARKCLAW_ISCP_AUTHORITY_TOKEN_FILE:-}
      SPARKCLAW_ISCP_AUTHORITY_TOKEN: ${SPARKCLAW_ISCP_AUTHORITY_TOKEN:-}
      SPARKCLAW_MCP_LOCAL_DOMAIN_ID: ${SPARKCLAW_MCP_LOCAL_DOMAIN_ID:-sparkclaw-local}
      LOCALMIND_MCP_URL: ${LOCALMIND_MCP_URL:-}
      LOCALMIND_MCP_TOKEN: ${LOCALMIND_MCP_TOKEN:-}
      SPARKCLAW_TOOLS_POLICY_PATH: ${SPARKCLAW_TOOLS_POLICY_PATH:-/var/lib/sparkclaw/memory/tools.policy.json}
      SPARKCLAW_FAST_BASE_URL: ${SPARKCLAW_FAST_BASE_URL:-http://sparkclaw-fast:8001/v1}
      SPARKCLAW_FAST_MODEL: ${SPARKCLAW_FAST_MODEL:-sparkclaw-fast}
      SPARKCLAW_FAST_SERVED_NAME: ${SPARKCLAW_FAST_SERVED_NAME:-sparkclaw-fast}
      SPARKCLAW_DEEP_BASE_URL: ${SPARKCLAW_DEEP_BASE_URL:-http://sparkclaw-fast:8001/v1}
      SPARKCLAW_DEEP_MODEL: ${SPARKCLAW_DEEP_MODEL:-sparkclaw-fast}
      SPARKCLAW_DEEP_SERVED_NAME: ${SPARKCLAW_DEEP_SERVED_NAME:-sparkclaw-deep}
      SPARKCLAW_EMBEDDING_BASE_URL: ${SPARKCLAW_EMBEDDING_BASE_URL:-http://sparkclaw-embedding:8003/v1}
      SPARKCLAW_EMBEDDING_MODEL: ${SPARKCLAW_EMBEDDING_MODEL:-sparkclaw-embedding}
      SPARKCLAW_GUARD_BASE_URL: ${SPARKCLAW_GUARD_BASE_URL:-http://sparkclaw-guard:8005/v1}
      SPARKCLAW_GUARD_MODEL: ${SPARKCLAW_GUARD_MODEL:-Qwen/Qwen3Guard-Gen-0.6B}
      SPARKCLAW_MODEL_CAPACITY_PROFILE: ${SPARKCLAW_MODEL_CAPACITY_PROFILE:?select a capacity profile via deploy:local/start:local or deploy:remote/start:remote}
      SPARKCLAW_OCR_ENABLED: ${SPARKCLAW_OCR_ENABLED:-false}
      SPARKCLAW_OCR_PROVIDER: ${SPARKCLAW_OCR_PROVIDER:-openai-http}
      SPARKCLAW_OCR_BASE_URL: ${SPARKCLAW_OCR_BASE_URL:-}
      SPARKCLAW_OCR_ALLOWED_HOSTS: ${SPARKCLAW_OCR_ALLOWED_HOSTS:-}
      SPARKCLAW_OCR_MODEL: ${SPARKCLAW_OCR_MODEL:-sparkclaw-ocr}
      SPARKCLAW_OCR_TIMEOUT_SECONDS: ${SPARKCLAW_OCR_TIMEOUT_SECONDS:-120}
      SPARKCLAW_OCR_MAX_UPLOAD_BYTES: ${SPARKCLAW_OCR_MAX_UPLOAD_BYTES:-12582912}
      SPARKCLAW_OCR_MAX_OUTPUT_BYTES: ${SPARKCLAW_OCR_MAX_OUTPUT_BYTES:-1048576}
      SPARKCLAW_OCR_MAX_CONCURRENCY: ${SPARKCLAW_OCR_MAX_CONCURRENCY:-2}
      SPARKCLAW_OCR_MAX_PENDING: ${SPARKCLAW_OCR_MAX_PENDING:-2}
      SPARKCLAW_PPTX_VISUAL_QA_PHASE: ${SPARKCLAW_PPTX_VISUAL_QA_PHASE:-shadow}
      SPARKCLAW_PPTX_VISUAL_QA_REPAIR_QUALIFIED_CLASSES: ${SPARKCLAW_PPTX_VISUAL_QA_REPAIR_QUALIFIED_CLASSES:-}
      SPARKCLAW_PPTX_VISUAL_QA_REPAIR_QUALIFIED_OPERATIONS: ${SPARKCLAW_PPTX_VISUAL_QA_REPAIR_QUALIFIED_OPERATIONS:-}
      SPARKCLAW_PPTX_VISUAL_QA_BLOCKING_QUALIFIED_CLASSES: ${SPARKCLAW_PPTX_VISUAL_QA_BLOCKING_QUALIFIED_CLASSES:-}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_REPAIR_ATTEMPTS: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_REPAIR_ATTEMPTS:-2}
      SPARKCLAW_PPTX_VISUAL_QA_BASE_URL: ${SPARKCLAW_PPTX_VISUAL_QA_BASE_URL:-http://gotenberg:3000}
      SPARKCLAW_PPTX_VISUAL_QA_ALLOWED_HOSTS: ${SPARKCLAW_PPTX_VISUAL_QA_ALLOWED_HOSTS:-gotenberg}
      SPARKCLAW_PPTX_VISUAL_QA_TIMEOUT_SECONDS: ${SPARKCLAW_PPTX_VISUAL_QA_TIMEOUT_SECONDS:-120}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_INPUT_BYTES: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_INPUT_BYTES:-67108864}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_PDF_BYTES: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_PDF_BYTES:-67108864}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_PAGES: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_PAGES:-100}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_CHANGED_PAGES: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_CHANGED_PAGES:-20}
      SPARKCLAW_PPTX_VISUAL_QA_RASTER_SCALE: ${SPARKCLAW_PPTX_VISUAL_QA_RASTER_SCALE:-1.5}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_PAGE_PIXELS: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_PAGE_PIXELS:-20000000}
      SPARKCLAW_PPTX_VISUAL_QA_MAX_PNG_BYTES: ${SPARKCLAW_PPTX_VISUAL_QA_MAX_PNG_BYTES:-12582912}
      SPARKCLAW_PPTX_VISUAL_QA_DIAGNOSTIC_TOLERANCE_MILLI: ${SPARKCLAW_PPTX_VISUAL_QA_DIAGNOSTIC_TOLERANCE_MILLI:-2}
      SPARKCLAW_PPTX_VISUAL_QA_READINESS_TTL_SECONDS: ${SPARKCLAW_PPTX_VISUAL_QA_READINESS_TTL_SECONDS:-300}
      SPARKCLAW_WORKFLOW_STAGE_EVIDENCE_MAX_BYTES: ${SPARKCLAW_WORKFLOW_STAGE_EVIDENCE_MAX_BYTES:-8000}
      SPARKCLAW_WORKFLOW_RUN_OBSERVATION_COMPACTION_BYTES: ${SPARKCLAW_WORKFLOW_RUN_OBSERVATION_COMPACTION_BYTES:-}
      SPARKCLAW_WORKFLOW_RUN_MAX_OBSERVATION_BYTES: ${SPARKCLAW_WORKFLOW_RUN_MAX_OBSERVATION_BYTES:-}
      SPARKCLAW_WEB_SEARCH_ENABLED: ${SPARKCLAW_WEB_SEARCH_ENABLED:-false}
      SPARKCLAW_WEB_SEARCH_PROVIDER: ${SPARKCLAW_WEB_SEARCH_PROVIDER:-infinimesh-info}
      SPARKCLAW_INFINIMESH_INFO_BASE_URL: ${SPARKCLAW_INFINIMESH_INFO_BASE_URL:-https://info.infinimesh.cloud}
      SPARKCLAW_INFINIMESH_INFO_TOKEN_BATCH_SIZE: ${SPARKCLAW_INFINIMESH_INFO_TOKEN_BATCH_SIZE:-10}
      SPARKCLAW_INFINIMESH_INFO_MAX_ATTEMPTS: ${SPARKCLAW_INFINIMESH_INFO_MAX_ATTEMPTS:-3}
      SPARKCLAW_INFINIMESH_INFO_RETRY_BASE_DELAY_MS: ${SPARKCLAW_INFINIMESH_INFO_RETRY_BASE_DELAY_MS:-200}
      SPARKCLAW_INFINIMESH_INFO_REQUEST_TIMEOUT_SECONDS: ${SPARKCLAW_INFINIMESH_INFO_REQUEST_TIMEOUT_SECONDS:-30}
      SPARKCLAW_INFINIMESH_INFO_RESPONSE_BODY_MAX_BYTES: ${SPARKCLAW_INFINIMESH_INFO_RESPONSE_BODY_MAX_BYTES:-4194304}
      SPARKCLAW_INFINIMESH_INFO_LANGUAGE: ${SPARKCLAW_INFINIMESH_INFO_LANGUAGE:-zh-CN}
      SPARKCLAW_INFINIMESH_INFO_MAX_SOURCES: ${SPARKCLAW_INFINIMESH_INFO_MAX_SOURCES:-8}
      SPARKCLAW_INFINIMESH_INFO_LICENSE_ID: ${SPARKCLAW_INFINIMESH_INFO_LICENSE_ID:-}
      SPARKCLAW_INFINIMESH_INFO_LICENSE_KEY: ${SPARKCLAW_INFINIMESH_INFO_LICENSE_KEY:-}
      SPARKCLAW_INFINIMESH_INFO_LICENSE_KEY_FILE: ${SPARKCLAW_INFINIMESH_INFO_LICENSE_KEY_FILE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../configs:/app/configs:ro
      - ../data/workspaces:/var/lib/sparkclaw/workspaces
      - ../data/traces:/var/lib/sparkclaw/traces
      - ../data/artifacts:/var/lib/sparkclaw/artifacts
      - ../data/memory:/var/lib/sparkclaw/memory
      - ../data/logs:/var/log/sparkclaw
      - ${SPARKCLAW_BROWSER_EXTENSION_RUNTIME_DIR_HOST:-/run/user/1000/sparkclaw/browser-controller}:/run/sparkclaw/browser-controller:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18789/healthz').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sparkclaw_internal

  gotenberg:
    profiles: ["product", "eval"]
    image: gotenberg/gotenberg:8.36.0@sha256:87c16b9f364279d321bc9772d31fa58aa6abe036423c270698bd636c3a8e9466
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=120s
      - --api-disable-health-check-route-telemetry=true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - sparkclaw_internal

  sandbox-runner:
    profiles: ["product", "eval"]
    build:
      context: ..
      dockerfile: docker/images/sandbox-runner.Dockerfile
    restart: unless-stopped
    environment:
      SPARKCLAW_SANDBOX_RUNNER_ADDR: 0.0.0.0:18889
      SPARKCLAW_SANDBOX_HOST_WORKSPACE_ROOT: ${SPARKCLAW_SANDBOX_HOST_WORKSPACE_ROOT:-${PWD}/data/workspaces}
      SPARKCLAW_SANDBOX_CONTAINER_WORKSPACE_ROOT: ${SPARKCLAW_SANDBOX_CONTAINER_WORKSPACE_ROOT:-/var/lib/sparkclaw/workspaces}
    ports:
      - "127.0.0.1:18889:18889"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/workspaces:/var/lib/sparkclaw/workspaces
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18889/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - sparkclaw_internal

  webchat:
    profiles: ["product", "eval"]
    build:
      context: ..
      dockerfile: docker/images/webchat.Dockerfile
    restart: unless-stopped
    environment:
      SPARKCLAW_WEBCHAT_PROXY_TOKEN: ${SPARKCLAW_WEBCHAT_PROXY_TOKEN:?run npm run deploy:local or npm run deploy:remote first}
    ports:
      - "${SPARKCLAW_WEBCHAT_BIND:-0.0.0.0}:${SPARKCLAW_WEBCHAT_PORT:-18790}:18790"
      - "127.0.0.1:18795:18795"
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - sparkclaw_internal

  postgres:
    profiles: ["product", "eval"]
    build:
      context: ..
      dockerfile: docker/images/postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparkclaw
      POSTGRES_PASSWORD: sparkclaw
      POSTGRES_DB: sparkclaw
    volumes:
      - sparkclaw_pg18:/var/lib/postgresql
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sparkclaw -d sparkclaw"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - sparkclaw_internal

  minio:
    profiles: ["eval"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sparkclaw
      MINIO_ROOT_PASSWORD: sparkclaw-local
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - sparkclaw_minio:/data
    networks:
      - sparkclaw_internal

  minio-init:
    profiles: ["eval"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set sparkclaw http://minio:9000 sparkclaw sparkclaw-local >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing sparkclaw/${SPARKCLAW_ARTIFACT_BUCKET:-sparkclaw}
    networks:
      - sparkclaw_internal

  evaluator:
    profiles: ["eval"]
    build:
      context: ..
      dockerfile: docker/images/evaluator.Dockerfile
    environment:
      SPARKCLAW_EVALUATOR_GATEWAY_URL: http://gateway:18789
      SPARKCLAW_EVALUATOR_PROFILE: api-smoke
      SPARKCLAW_EVALUATOR_OUTPUT: /reports/evaluator-report.json
      SPARKCLAW_EVALUATOR_CONFIG: /app/configs/eval.profiles.json
    volumes:
      - ../configs:/app/configs:ro
      - ../data/eval:/reports
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - sparkclaw_internal

networks:
  sparkclaw_internal:
    driver: bridge

volumes:
  sparkclaw_pg18:
  sparkclaw_minio:
