server {
  listen 18790;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://gateway:18789/api/;
  }

  location /healthz {
    proxy_pass http://gateway:18789/healthz;
  }

  location /readyz {
    proxy_pass http://gateway:18789/readyz;
  }
}
