server {
  listen 18790;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://gateway:18789/api/;
  }

  location /healthz {
    proxy_pass http://gateway:18789/healthz;
  }

  location /readyz {
    proxy_pass http://gateway:18789/readyz;
  }
}
