server {
  listen 18790;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /api/jingsi/v0/readyz {
    return 404;
  }

  location = /api/messages/stream {
    return 404;
  }

  location = /api/client-events/v0/head {
    return 404;
  }

  location = /api/client-events/v0 {
    return 404;
  }

  location = /api/client-events/v0/stream {
    return 404;
  }

  location = /api/speech/realtime {
    access_log off;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
    proxy_read_timeout 90s;
    proxy_send_timeout 90s;
    proxy_pass http://gateway:18789$request_uri;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://gateway:18789$request_uri;
  }

  location = /mcp {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://gateway:18789$request_uri;
  }

  location /healthz {
    proxy_pass http://gateway:18789$request_uri;
  }

  location /readyz {
    proxy_pass http://gateway:18789$request_uri;
  }
}

server {
  listen 18793;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  server_tokens off;
  access_log off;
  client_max_body_size 1025k;

  location = /readyz {
    if ($request_method != GET) { return 405; }
    proxy_pass http://gateway:18789/api/jingsi/v0/readyz$is_args$args;
  }

  location = /api/messages/stream {
    if ($request_method != POST) { return 405; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://gateway:18789$request_uri;
  }

  location = /api/client-events/v0/head {
    if ($request_method != GET) { return 405; }
    proxy_pass http://gateway:18789$request_uri;
  }

  location = /api/client-events/v0 {
    if ($request_method != GET) { return 405; }
    proxy_pass http://gateway:18789$request_uri;
  }

  location = /api/client-events/v0/stream {
    if ($request_method != GET) { return 405; }
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_pass http://gateway:18789$request_uri;
  }

  location / {
    return 404;
  }
}
