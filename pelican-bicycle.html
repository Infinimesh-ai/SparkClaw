<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f3e9">
  <meta name="description" content="一只骑着自行车的鹈鹕，一场慢悠悠的海边兜风。纯 SVG 2D 动画。">
  <title>去兜兜风 · 鹈鹕骑行记</title>
  <style>
    :root { color-scheme: light; --ink:#284c47; --paper:#f5f3e9; --muted:#71827a; --accent:#d9714f; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Avenir Next","PingFang SC","Microsoft YaHei",sans-serif; }
    button, input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:5px; }
    .page { max-width:1440px; margin:0 auto; padding:30px 56px 24px; }
    header { display:flex; align-items:center; justify-content:space-between; padding-bottom:23px; border-bottom:1px solid #284c4729; }
    .brand { display:flex; align-items:center; gap:11px; font-size:12px; font-weight:700; letter-spacing:2.6px; }
    .brand svg { width:34px; height:34px; }
    .edition { color:var(--muted); font-size:11px; letter-spacing:2px; }
    .intro { display:flex; justify-content:space-between; align-items:flex-end; padding:34px 0 27px; gap:24px; }
    .eyebrow { margin:0 0 11px; color:var(--accent); font-size:11px; font-weight:600; letter-spacing:3.6px; }
    h1 { margin:0; font-size:clamp(36px,4.5vw,60px); font-weight:600; letter-spacing:2px; line-height:1.2; }
    .intro-note { margin:0 0 4px; color:var(--muted); font-size:13px; line-height:1.9; text-align:right; }
    .scene { position:relative; overflow:hidden; background:#e5ede5; border-radius:18px; isolation:isolate; }
    .scene > svg { display:block; width:100%; height:auto; }
    .scene-label { position:absolute; top:25px; left:29px; display:flex; gap:9px; align-items:center; font-size:10px; letter-spacing:2px; color:#58746b; }
    .scene-label::before { content:""; width:6px; height:6px; background:#8da78e; border-radius:50%; }
    .scene-number { position:absolute; right:28px; top:23px; font:italic 17px Georgia,serif; color:#6c8579; }
    .caption { position:absolute; right:29px; bottom:22px; font-size:10px; color:#496b5e; letter-spacing:2px; }
    .controls { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:24px 0; border-bottom:1px solid #284c4729; }
    .playback { display:flex; align-items:center; gap:21px; }
    .toggle { border:0; border-radius:50%; background:var(--ink); color:var(--paper); width:48px; height:48px; display:grid; place-items:center; cursor:pointer; transition:background .2s,transform .2s; }
    .toggle:hover { background:#3b665b; transform:translateY(-2px); }
    .toggle svg { width:18px; height:18px; }
    .control-title { display:block; font-size:13px; font-weight:600; margin-bottom:5px; }
    .control-hint { color:var(--muted); font-size:11px; letter-spacing:.4px; }
    .speed-control { display:flex; align-items:center; gap:16px; }
    .speed-control label { font-size:12px; color:#657c70; }
    input[type=range] { width:130px; height:4px; accent-color:var(--ink); cursor:pointer; }
    output { min-width:35px; font-size:12px; font-variant-numeric:tabular-nums; }
    footer { display:flex; align-items:center; justify-content:space-between; padding-top:20px; gap:14px; color:#75847b; font-size:10px; letter-spacing:1px; }
    .footer-left { display:flex; align-items:center; gap:8px; }
    .footer-left svg { width:15px; height:15px; }
    .footer-right { letter-spacing:2px; font-size:9px; }
    @media(min-width:1500px) { .page { padding-top:42px; } .intro { padding-top:40px; padding-bottom:34px; } }
    @media(max-width:680px) {
      .page { padding:22px 20px; }
      header { padding-bottom:18px; } .brand { font-size:10px; letter-spacing:1.7px; }
      .edition { font-size:9px; letter-spacing:1px; }
      .intro { padding:28px 0 23px; display:block; }
      .eyebrow { font-size:9px; letter-spacing:2.8px; }
      .intro-note { text-align:left; font-size:12px; margin:13px 0 0; }
      .intro-note br { display:none; }
      .scene > svg { width:160%; max-width:none; margin-left:-30%; }
      .scene { border-radius:12px; }
      .scene-label { left:17px; top:18px; font-size:8px; letter-spacing:1px; }
      .scene-number { right:17px; top:16px; font-size:14px; }
      .caption { font-size:8px; right:16px; bottom:15px; letter-spacing:1px; }
      .controls { gap:14px; flex-wrap:wrap; padding:21px 0; }
      .playback { gap:12px; } .toggle { width:42px; height:42px; }
      .control-title { font-size:12px; } .control-hint { font-size:10px; }
      .speed-control { gap:10px; margin-left:auto; }
      .speed-control label { font-size:10px; } input[type=range] { width:76px; }
      footer { font-size:9px; line-height:1.8; } .footer-right { font-size:8px; letter-spacing:1px; }
    }
    @media(prefers-reduced-motion:reduce) { .toggle { transition:none; } }
  </style>
</head>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries(['rear-wheel','front-wheel','rider','scarf-tail','near-leg-path','near-leg-highlight','far-leg-path','near-foot','far-foot','crank','chainring','clouds','gulls','coast','road','verge','shadow','sea-lines'].map(id => [id, byId(id)]));
      const button = byId('toggle');
      const speedInput = byId('speed');
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      let paused = motionPreference.matches;
      let speed = Number(speedInput.value);
      let time = 0;
      let previousTime = null;
      let requestId = null;

      function render() {
        const angle = time * Math.PI * 2 / 1.6;
        const bob = Math.sin(angle * 2) * 1.8;
        const rotation = time * 108;
        parts['rear-wheel'].setAttribute('transform', `rotate(${rotation})`);
        parts['front-wheel'].setAttribute('transform', `rotate(${rotation})`);
        parts.rider.setAttribute('transform', `translate(0 ${bob})`);
        parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(time * 6) * 3} 607 222)`);
        parts.chainring.setAttribute('transform', `rotate(${angle * 180 / Math.PI} 580 452)`);
        const feet = [0, Math.PI].map(offset => ({x:580 + Math.cos(angle + offset) * 33, y:452 + Math.sin(angle + offset) * 33}));
        // Two-segment inverse kinematics keeps each leg attached to its pedal.
        function legPath(hip, foot, upper, lower) {
          const dx = foot.x - hip.x, dy = foot.y - 9 - hip.y;
          const distance = Math.hypot(dx, dy);
          const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
          const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
          const kneeX = hip.x + along * dx / distance + bend * dy / distance;
          const kneeY = hip.y + along * dy / distance - bend * dx / distance;
          return `M${hip.x} ${hip.y}L${kneeX} ${kneeY}L${foot.x} ${foot.y - 9}`;
        }
        const nearPath = legPath({x:560,y:326 + bob}, feet[0], 83, 84);
        parts['near-leg-path'].setAttribute('d', nearPath);
        parts['near-leg-highlight'].setAttribute('d', nearPath);
        parts['far-leg-path'].setAttribute('d', legPath({x:546,y:324 + bob}, feet[1], 84, 87));
        parts['near-foot'].setAttribute('transform', `translate(${feet[0].x} ${feet[0].y})`);
        parts['far-foot'].setAttribute('transform', `translate(${feet[1].x} ${feet[1].y})`);
        parts.crank.setAttribute('d', `M${feet[0].x} ${feet[0].y}L${feet[1].x} ${feet[1].y}`);
        parts.clouds.setAttribute('transform', `translate(${-((time * 5) % 1200)} 0)`);
        parts.gulls.setAttribute('transform', `translate(${Math.sin(time * .3) * 16} ${Math.sin(time * .8) * 4})`);
        parts.coast.setAttribute('transform', `translate(${-((time * 22) % 1200)} 0)`);
        parts.road.setAttribute('transform', `translate(${-((time * 160) % 1200)} 0)`);
        parts.verge.setAttribute('transform', `translate(${-((time * 180) % 1200)} 0)`);
        parts['sea-lines'].setAttribute('transform', `translate(${Math.sin(time * .4) * 8} 0)`);
        parts.shadow.setAttribute('rx', 226 + bob * 1.4);
      }
      function tick(timestamp) {
        requestId = null;
        if (paused || document.hidden) { previousTime = null; return; }
        if (previousTime !== null) time += Math.min((timestamp - previousTime) / 1000, .05) * speed;
        previousTime = timestamp;
        render();
        requestId = requestAnimationFrame(tick);
      }
      function syncPlayback() {
        button.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
        button.setAttribute('aria-pressed', String(paused));
        byId('pause-icon').style.display = paused ? 'none' : 'block';
        byId('play-icon').style.display = paused ? 'block' : 'none';
        byId('playback-label').textContent = paused ? '歇一会儿，看看海' : '正在慢悠悠地骑行';
        if (requestId !== null) cancelAnimationFrame(requestId);
        requestId = null;
        previousTime = null;
        if (!paused && !document.hidden) requestId = requestAnimationFrame(tick);
      }
      button.addEventListener('click', () => { paused = !paused; syncPlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed}×`;
        speedInput.setAttribute('aria-valuetext', `${speed} 倍速度`);
      });
      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.ctrlKey || event.altKey || event.metaKey) return;
        if (event.target.closest('button, input, select, textarea, a, [contenteditable]')) return;
        event.preventDefault();
        paused = !paused;
        syncPlayback();
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', event => { paused = event.matches; syncPlayback(); });
      render();
      syncPlayback();
    })();
  </script>
</body>
</html>
