{{define "login"}}{{template "head" .}}
<body>
<div class="flex min-h-dvh items-center justify-center bg-paper px-4">
  <div class="rounded-lg border border-slate-200 bg-white w-full max-w-[420px] rounded-xl p-8">
    {{template "logo"}}
    <p class="mt-5 text-xs font-bold tracking-[0.14em] text-slate-500 uppercase">Console</p>
    <h1 class="mt-2 text-[26px] text-ink-900">登录控制台</h1>
    <p class="mt-2 text-sm text-slate-500">开发环境控制台，使用管理员密码登录。</p>
    {{if .Error}}<p class="mt-3 rounded-md border border-danger-600/30 bg-danger-100 px-3 py-2 text-sm text-danger-700">{{.Error}}</p>{{end}}
    <form method="post" action="/login" class="mt-4 space-y-4">
      <input type="hidden" name="next" value="{{.Next}}">
      <div class="space-y-1.5">
        <label for="password" class="block text-sm font-medium text-ink-800">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus placeholder="请输入密码" class="h-10 w-full rounded-md border border-slate-300 bg-white px-3 text-sm text-ink-900 placeholder:text-slate-400">
      </div>
      <button type="submit" class="inline-flex h-10 items-center gap-1.5 rounded-md px-4 text-sm font-semibold transition-[background-color,filter] disabled:cursor-not-allowed bg-signal-500 text-ink-950 hover:brightness-95 disabled:opacity-55 mt-5 h-12 w-full justify-center text-[15px]">登录</button>
    </form>
    <p class="mt-4 text-center text-xs text-slate-400">SparkClaw 自建控制台 · 仅用于开发</p>
  </div>
</div>
</body>
</html>{{end}}
